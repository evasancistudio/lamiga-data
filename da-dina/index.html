<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Da Dina × La Miga — Caso de éxito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
  <style>
  :root {
    --azul: #1A1AFF;
  --coral: #FF6B4A;
      --crema: #F0EDE4;
      --negro: #0A0A0A;
  --gris: #5A5A5A;
  --linea: #E2DFDA;
    }
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--crema); color: var(--negro); padding-bottom: 88px; }

.cta-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; display: flex; gap: 10px; padding: 12px 20px 20px; background: var(--crema); border-top: 1px solid var(--linea); }
.cta-bar a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 12px; border-radius: 12px; text-decoration: none; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 15px; }
.cta-bar svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.cta-phone { background: var(--azul); color: white; }
.cta-wa { background: #25D366; color: white; }

.hero { background: var(--azul); display: flex; flex-direction: column; justify-content: flex-end; padding: 56px 28px 52px; }
.hero-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 28px; }
.hero-title { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.08; color: white; margin-bottom: 22px; }
.hero-sub { font-size: 17px; line-height: 1.65; color: rgba(255,255,255,0.6); max-width: 420px; }
.hero-logo { width: 120px; height: auto; margin-bottom: 48px; }

.block { padding: 68px 28px 72px; border-bottom: 1px solid var(--linea); }
.block-dark { background: var(--negro); border-bottom: none; }
.block-num { font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--coral); margin-bottom: 28px; display: block; }
.block-dark .block-num { color: rgba(255,255,255,0.3); }
.block-title { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; color: var(--negro); margin-bottom: 36px; }
.block-dark .block-title { color: white; }

  .diag-list { list-style: none; display: flex; flex-direction: column; gap: 18px; margin-bottom: 12px; }
.diag-item { display: flex; gap: 14px; align-items: flex-start; }
.diag-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); flex-shrink: 0; margin-top: 7px; }
.diag-text { font-size: 16px; line-height: 1.6; color: var(--gris); }
.diag-text strong { color: var(--negro); font-weight: 500; }

.consequence { background: var(--negro); border-radius: 16px; padding: 28px 24px; margin: 32px 0; }
.consequence p { font-size: 17px; line-height: 1.7; color: rgba(255,255,255,0.7); }
.consequence em { color: white; font-style: normal; font-weight: 500; }
.consequence .m-highlight { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 44px; color: var(--coral); display: block; margin-bottom: 10px; }

.solution-label { font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--azul); margin-bottom: 10px; display: block; }
.solution-text { font-size: 15.5px; line-height: 1.65; color: var(--gris); }

.kpi-block { background: var(--coral); }
.kpi-block .block-num { color: rgba(255,255,255,0.55); }
.kpi-block .block-title { color: white; }
.metricas-row { display: flex; gap: 32px; margin-bottom: 8px; flex-wrap: wrap; }
.metrica { flex: 1; min-width: 130px; }
.m-num { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 46px; color: white; display: block; line-height: 1; margin-bottom: 8px; }
.m-label { font-size: 13.5px; color: rgba(255,255,255,0.7); line-height: 1.45; }

table.data { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
table.data th, table.data td { text-align: left; padding: 12px 10px; font-size: 14.5px; border-bottom: 1px solid var(--linea); }
table.data th { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--gris); }
table.data td.num { font-weight: 700; color: var(--negro); }
table.data td.pos { color: #1a8a4a; font-weight: 700; }
table.data td.neg { color: var(--gris); font-weight: 500; }
.table-wrap { overflow-x: auto; margin-bottom: 32px; }

.tag-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
.tag { background: white; border: 1.5px solid var(--linea); border-radius: 30px; padding: 8px 16px; font-size: 13.5px; color: var(--gris); }
.tag strong { color: var(--negro); }

.cta-section { padding: 56px 28px; border-bottom: 1px solid var(--linea); text-align: center; }
.cta-section a { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--azul); color: white; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 18px; padding: 20px 32px; border-radius: 14px; text-decoration: none; width: 100%; }
.cta-section a svg { width: 20px; height: 20px; fill: white; flex-shrink: 0; }
.cta-section p { font-size: 14px; color: var(--gris); margin-top: 14px; }

.nosotros-logo { width: 110px; height: auto; margin-bottom: 40px; display: block; }
nosotros-text { font-size: 17px; line-height: 1.75; color: rgba(255,255,255,0.6); margin-bottom: 22px; }
.nosotros-text:last-child { margin-bottom: 0; }
.block-cta { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 32px; background: var(--coral); color: white; font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 17px; padding: 18px 24px; border-radius: 12px; text-decoration: none; width: 100%; }
.block-cta svg { width: 18px; height: 18px; fill: white; flex-shrink: 0; }

.foot { text-align: center; padding: 28px; font-size: 12.5px; color: var(--gris); }

@media (min-width: 700px) {
  .hero { padding: 72px 60px 64px; }
  .hero-title { font-size: 54px; }
  .block { padding: 96px 60px; max-width: 760px; margin: 0 auto; }
  .cta-section { padding: 72px 60px; max-width: 760px; margin: 0 auto; }
  .cta-section a { width: auto; padding: 20px 40px; font-size: 19px; }
  .block-cta { width: auto; }
  .cta-bar { padding: 14px 60px 18px; max-width: 760px; left: 50%; right: auto; transform: translateX(-50%); border-radius: 16px 16px 0 0; border-left: 1px solid var(--linea); border-right: 1px solid var(--linea); }
}
</style>
  </head>
  <body>
